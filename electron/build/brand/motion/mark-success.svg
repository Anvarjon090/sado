<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 180 180" width="180" height="180" style="background:#0E1013;color:#E9ECEF">
<style>
.mark {
  --mark-ink: currentColor;
  --mark-accent: #5E5CE6;
  fill: none;
  stroke: var(--mark-ink);
  stroke-width: 11;
  overflow: visible;
}
.mark circle {
  transform-box: view-box;
  transform-origin: 0 70px;            
  transition: opacity 180ms ease, stroke 180ms ease;
}
.mark__r1 { opacity: 1; }
.mark__r2 { opacity: .65; }
.mark__r3 { opacity: .35; }
.mark[data-interactive]:hover .mark__r2 { opacity: .85; }
.mark[data-interactive]:hover .mark__r3 { opacity: .6; }
@keyframes mark-reveal { from { transform: scale(.25); opacity: 0; } }
.mark[data-state="reveal"] circle { animation: mark-reveal 700ms cubic-bezier(.2, .8, .2, 1) both; }
.mark[data-state="reveal"] .mark__r2 { animation-delay: 110ms; }
.mark[data-state="reveal"] .mark__r3 { animation-delay: 220ms; }
@keyframes mark-beat { 0%, 100% { transform: scale(1); } 20% { transform: scale(1.07); } }
@keyframes mark-wave-2 { 0%, 100% { opacity: .65; transform: scale(1); } 35% { opacity: 1; transform: scale(1.03); } }
@keyframes mark-wave-3 { 0%, 100% { opacity: .35; transform: scale(1); } 35% { opacity: .85; transform: scale(1.03); } }
.mark[data-state="listening"] .mark__r1 { animation: mark-beat 1.6s ease-in-out infinite; }
.mark[data-state="listening"] .mark__r2 { animation: mark-wave-2 1.6s ease-in-out .18s infinite; }
.mark[data-state="listening"] .mark__r3 { animation: mark-wave-3 1.6s ease-in-out .36s infinite; }
/* Aks-sado: ichki halqa joyida turadi, undan yangi halqalar chiqib, tashqi halqa o'lchamigacha kattalashadi va so'nadi */
@keyframes mark-ping { 0% { r: 22.5px; cx: 28px; opacity: 0; } 18% { opacity: .85; } 100% { r: 64.5px; cx: 70px; opacity: 0; } }
.mark[data-state="processing"] .mark__r2 { animation: mark-ping 1.8s cubic-bezier(.3, 0, .5, 1) infinite; }
.mark[data-state="processing"] .mark__r3 { animation: mark-ping 1.8s cubic-bezier(.3, 0, .5, 1) -.9s infinite; }
@keyframes mark-talk-2 { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes mark-talk-3 { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
.mark[data-state="speaking"] .mark__r2 { animation: mark-talk-2 520ms ease-in-out infinite; }
.mark[data-state="speaking"] .mark__r3 { animation: mark-talk-3 520ms ease-in-out 80ms infinite; }
.mark[data-state="speaking-live"] .mark__r2 { transform: scale(calc(1 + var(--mark-amp, 0) * .06)); transition: transform 90ms linear; }
.mark[data-state="speaking-live"] .mark__r3 { transform: scale(calc(1 + var(--mark-amp, 0) * .10)); transition: transform 90ms linear; }
@keyframes mark-pop { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.08); opacity: 1; stroke: var(--mark-accent); } }
.mark[data-state="success"] circle { animation: mark-pop 480ms cubic-bezier(.2, .8, .2, 1) both; }
.mark[data-state="success"] .mark__r2 { animation-delay: 50ms; }
.mark[data-state="success"] .mark__r3 { animation-delay: 100ms; }
.mark[data-state="muted"] .mark__r2 { opacity: .3; }
.mark[data-state="muted"] .mark__r3 { opacity: .15; }
@media (prefers-reduced-motion: reduce) {
  .mark circle { animation: none !important; transition: none !important; transform: none !important; }
}

.mark circle{animation-iteration-count:1}</style>
<svg class="mark" data-state="success" viewBox="0 0 140 140" x="0" y="0" width="140" height="140">
<circle class="mark__r3" cx="70" cy="70" r="64.5"/><circle class="mark__r2" cx="49" cy="70" r="43.5"/><circle class="mark__r1" cx="28" cy="70" r="22.5"/>
</svg></svg>
